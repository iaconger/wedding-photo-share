<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Kiley & Ian · Photo Sign</title>
<meta name="robots" content="noindex">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:ital,opsz,wght@0,6..96,400;1,6..96,400&family=Figtree:wght@400;500;600&display=swap">
<style>
  /* A 5x7 table sign. Print it from the browser, or save the QR on its own. */
  :root { --ink: #16302f; --muted: #5d7170; --leaf: #b9792a; --line: #d5dedb; }
  * { box-sizing: border-box; }
  body { margin: 0; background: #e7ecea; color: var(--ink); font: 400 1rem/1.5 "Figtree", system-ui, sans-serif; display: grid; gap: 1.25rem; justify-items: center; padding: 1.5rem 1rem 3rem; }
  .toolbar { display: flex; gap: .75rem; flex-wrap: wrap; justify-content: center; }
  .toolbar a, .toolbar button { font: 600 .9375rem/1 "Figtree", system-ui, sans-serif; color: #fff; background: #2c6166; border: 0; border-radius: 999px; padding: .85rem 1.25rem; text-decoration: none; cursor: pointer; }
  .toolbar a { background: transparent; color: var(--ink); border: 1px solid var(--ink); }
  .sign { width: 5in; max-width: 100%; aspect-ratio: 5 / 7; background: #fff; padding: .5in .45in; display: grid; grid-template-rows: auto 1fr auto; justify-items: center; text-align: center; gap: .2in; }
  .eyebrow { margin: 0; font-size: .7rem; font-weight: 600; letter-spacing: .2em; text-transform: uppercase; color: var(--leaf); }
  h1 { font: italic 400 2.6rem/1 "Bodoni Moda", "Didot", serif; margin: .12in 0 0; }
  h1 span { color: var(--leaf); font-size: .7em; }
  .qr { align-self: center; width: 2.6in; max-width: 100%; display: grid; gap: .15in; }
  .qr img { width: 100%; display: block; }
  h2 { font: 400 1.5rem/1.15 "Bodoni Moda", "Didot", serif; margin: 0; }
  p { margin: .08in 0 0; color: var(--muted); font-size: .85rem; }
  @media print {
    @page { size: 5in 7in; margin: 0; }
    body { background: #fff; padding: 0; display: block; }
    .toolbar { display: none; }
    .sign { width: 5in; height: 7in; }
  }
</style>
</head>
<body>
  <div class="toolbar">
    <button type="button" onclick="window.print()">Print sign (5 × 7)</button>
    <a href="/qr.png">Download QR only</a>
  </div>
  <div class="sign">
    <div>
      <p class="eyebrow">October 10, 2026</p>
      <h1>Kiley <span>&amp;</span> Ian</h1>
    </div>
    <div class="qr"><img src="/qr.svg" alt="QR code to the wedding photo album"></div>
    <div>
      <h2>Share your photos with us</h2>
      <p>Scan with your phone camera. Add what you take tonight and see everyone else's.</p>
    </div>
  </div>
</body>
</html>
