<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Kiley & Ian · Photo Sign</title>
<meta name="robots" content="noindex">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="/style.css">
<style>
  /* A 5x7 table sign. Print it from the browser, or save the QR on its own. */
  body { background: var(--soft); display: grid; gap: 1.25rem; justify-items: center; padding: 1.5rem 1rem 3rem; }
  .toolbar { display: flex; gap: .75rem; flex-wrap: wrap; justify-content: center; }
  .toolbar .btn { width: auto; min-height: 2.75rem; font-size: .9375rem; text-decoration: none; }
  .sign { width: 5in; max-width: 100%; aspect-ratio: 5 / 7; background: #fff; padding: .45in .45in .5in; display: grid; grid-template-rows: auto 1fr auto; justify-items: center; text-align: center; gap: .15in; }
  .sign .monogram { font-size: 2.75rem; margin-bottom: .1in; }
  .sign h1 { font-size: 2.25rem; -webkit-text-stroke: .4px currentColor; }
  .sign h1 .and { display: inline; font-size: .8125rem; padding-inline: .35em; }
  .qr { align-self: center; width: 2.5in; max-width: 100%; }
  .qr img { width: 100%; display: block; }
  .sign h2 { font-size: 2rem; }
  .sign p { margin: .06in auto 0; color: var(--muted); font-size: .78rem; max-width: 3.4in; }
  @media print {
    @page { size: 5in 7in; margin: 0; }
    body { background: #fff; padding: 0; display: block; }
    .toolbar { display: none; }
    .sign { width: 5in; height: 7in; }
  }
</style>
</head>
<body>
  <div class="toolbar">
    <button class="btn primary" type="button" onclick="window.print()">Print sign (5 × 7)</button>
    <a class="btn ghost" href="/qr.png">Download QR only</a>
  </div>
  <div class="sign">
    <div>
      <div class="monogram" aria-hidden="true"><span class="k">K</span><span class="amp">&amp;</span><span class="i">I</span></div>
      <h1>Kiley Hunt <span class="and">and</span> Ian Conger</h1>
    </div>
    <div class="qr"><img src="/qr.svg" alt="QR code to the wedding photo album"></div>
    <div>
      <h2>Share your photos with us</h2>
      <p>Scan with your phone camera. Add what you take tonight and see everyone else's.</p>
    </div>
  </div>
</body>
</html>
